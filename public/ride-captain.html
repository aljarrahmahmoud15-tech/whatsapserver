<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071522"><link rel="stylesheet" href="/direct-ride-notifications.css"><title>V27</title>
<style>:root{--bg:#071522;--panel:#0d2437;--panel2:#061522;--line:#234763;--text:#f5f8fb;--muted:#9eb2c2;--mint:#48dfb1;--gold:#f4c96e;--red:#ff8696;font-family:Tahoma,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% -5%,#1a465b 0,transparent 34rem),var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(720px,100%);margin:auto;padding:0 14px 40px}.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #ffffff17}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:21px;letter-spacing:.08em}.brand img{width:38px;height:38px;object-fit:contain}.live{color:var(--muted);font-size:10px}.card{margin-top:14px;padding:17px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#102c42ef,#071827f4);box-shadow:0 20px 65px #0006}.login{margin-top:70px}.eyebrow{margin:0 0 8px;color:var(--mint);font-size:11px;font-weight:900;letter-spacing:.08em}.card h1,.card h2,.card h3{margin:0}.card h1{font-size:30px}.card h2{font-size:19px}.muted{color:var(--muted);font-size:12px;line-height:1.85}.field{display:grid;gap:6px;margin-top:13px}.field label{color:var(--muted);font-size:11px}.input{width:100%;min-height:48px;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);outline:0}.input:focus{border-color:var(--mint);box-shadow:0 0 0 3px #48dfb11c}.main,.secondary,.danger{width:100%;min-height:50px;margin-top:13px;border-radius:13px;font-size:14px;font-weight:900}.main{border:0;background:var(--mint);color:#052119}.secondary{border:1px solid var(--line);background:#0a263b;color:var(--text)}.danger{border:1px solid #ff869666;background:#ff869612;color:#ffc1ca}.main:disabled,.secondary:disabled,.danger:disabled{opacity:.42;cursor:not-allowed}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.pill{padding:7px 10px;border:1px solid #48dfb155;border-radius:999px;color:var(--mint);background:#48dfb111;font-size:10px;font-weight:900;white-space:nowrap}.pill.wait{border-color:#f4c96e66;color:var(--gold);background:#f4c96e12}.pill.red{border-color:#ff869666;color:#ffc1ca;background:#ff869612}.notice{min-height:20px;margin-top:10px;color:var(--muted);font-size:11px;line-height:1.7}.notice.ok{color:var(--mint)}.notice.warn{color:var(--gold)}.offer{border-color:#48dfb177;background:linear-gradient(145deg,#0d3d47,#071827)}.route{display:grid;gap:0;margin-top:14px}.place{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #ffffff17;font-size:12px}.place:last-child{border:0}.place span{color:var(--muted);font-size:10px}.place b{text-align:left}.fare{display:flex;justify-content:space-between;align-items:end;gap:10px;padding:13px 0;border-top:1px solid #ffffff17}.fare span{color:var(--muted);font-size:10px}.fare strong{color:var(--gold);font-size:28px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{margin-top:0}.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.meter div{padding:12px 10px;border:1px solid #ffffff17;border-radius:12px;background:#061522}.meter span{display:block;color:var(--muted);font-size:10px}.meter b{display:block;margin-top:6px;font-size:17px}.meter b:last-child{color:var(--gold)}.empty{padding:32px 12px;border:1px dashed var(--line);border-radius:15px;color:var(--muted);text-align:center;font-size:12px;line-height:1.8}.hidden{display:none!important}.footer{display:flex;justify-content:space-between;margin-top:15px;color:#6f899b;font-size:9px}@media(max-width:430px){.wrap{padding:0 10px 32px}.actions{grid-template-columns:1fr}.meter{gap:5px}.meter div{padding:10px 7px}.meter b{font-size:14px}}
</style>
</head>
<body><main class="wrap"><header class="top"><div class="brand"><img src="/aljarah-logo-mark-clean.webp" alt=""><span>V27</span></div><span class="live">مساحة الكابتن</span></header>
<section class="card login" id="login-card"><p class="eyebrow">دخول الكابتن</p><h1>رحلاتك في قرار واحد.</h1><p class="muted">سجّل الدخول بحساب الكابتن المعتمد لاستقبال عروض الرحلات المباشرة.</p><div class="field"><label for="phone">رقم الهاتف</label><input class="input" id="phone" inputmode="tel" placeholder="07xxxxxxxx"></div><div class="field"><label for="pin">الرقم السري</label><input class="input" id="pin" type="password" inputmode="numeric" maxlength="5" placeholder="5 أرقام"></div><button class="main" id="login-button" type="button">دخول</button><div class="notice" id="login-notice"></div></section>
<section class="hidden" id="app"><section class="card"><div class="topline"><div><p class="eyebrow">الرحلات المباشرة</p><h2 id="hello">—</h2><p class="muted">حدّث موقعك ثم راجع أقرب عرض.</p></div><span class="pill" id="live-pill">متاح</span></div><button class="secondary" id="location-button" type="button">إرسال موقعي الآن</button><div class="notice" id="app-notice"></div></section><section class="card" id="rides-box"><div class="topline"><div><h2>العروض والرحلة الحالية</h2><p class="muted">لا يظهر هنا إلا عرض الرحلة أو الرحلة المقبولة.</p></div><button class="secondary" id="refresh-button" type="button" style="width:auto;min-width:100px;margin:0">تحديث</button></div><div id="rides-list" style="margin-top:12px"></div></section><button class="secondary" id="logout-button" type="button">تسجيل الخروج</button></section><footer class="footer"><span>V27 · كابتن</span><span>لا خصم عند القبول</span></footer></main>
<script src="/direct-ride-notifications.js"></script><script>
(() => { const $=s=>document.querySelector(s); const state={rides:[],watch:null,timer:null,stream:null}; const money=c=>`${(Number(c||0)/100).toFixed(2)} د.أ`; async function api(url,options={}){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok){const e=new Error(data.error||'تعذر الاتصال');e.status=response.status;throw e}return data} function notice(text,tone=''){const n=$('#app-notice');n.textContent=text;n.className=`notice ${tone}`} function loginNotice(text,tone=''){const n=$('#login-notice');n.textContent=text;n.className=`notice ${tone}`} function connectStream(){if(state.stream||!window.V27Notifications)return;state.stream=V27Notifications.connect({url:'/api/captain/direct-rides/events',audience:'captain',onEvent:(payload)=>{if(!payload.silent)void load()},onConnectionChange:(status)=>{if(status==='connected')notice('الإشعارات الفورية مفعلة.','ok');if(status==='reconnecting')notice('جاري إعادة الاتصال بالإشعارات؛ التحديث الدوري يعمل.','warn')}})} function closeStream(){state.stream?.close();state.stream=null} async function sendLocation(rideId=null){if(!navigator.geolocation)return notice('هذا الجهاز لا يدعم GPS.');return new Promise(resolve=>navigator.geolocation.getCurrentPosition(async p=>{try{await api('/api/captain/direct-rides/location',{method:'POST',body:JSON.stringify({rideId,lat:p.coords.latitude,lng:p.coords.longitude,accuracyM:p.coords.accuracy})});notice('تم تحديث موقعك.', 'ok');resolve(true)}catch(e){notice(e.message,'warn');resolve(false)}},e=>{notice(e.code===1?'اسمح بالموقع من إعدادات المتصفح.':'تعذر قراءة موقعك.','warn');resolve(false)},{enableHighAccuracy:true,timeout:10000,maximumAge:15000}))} function activeRide(){return state.rides.find(r=>['assigned','arrived','in_trip'].includes(r.status))||null} function render(){const box=$('#rides-list');if(!state.rides.length){box.innerHTML='<div class="empty">لا يوجد عرض الآن.<br>عند تأكيد رحلة من الراكب ستظهر هنا بيانات الإقلاع والوجهة والسعر.</div>';return}box.innerHTML=state.rides.map(ride=>{const offered=ride.status==='offered';const assigned=['assigned','arrived','in_trip'].includes(ride.status);const status=({offered:'عرض جديد',assigned:'تم القبول',arrived:'وصلت',in_trip:'العداد نشط'})[ride.status]||ride.status;return `<article class="card ${offered?'offer':''}" style="margin-top:10px;padding:14px"><div class="topline"><div><p class="eyebrow">${offered?'عرض قريب':'رحلة مخصصة'}</p><h3>${ride.requestCode}</h3></div><span class="pill ${ride.status==='in_trip'?'':'wait'}">${status}</span></div><div class="route"><div class="place"><span>الإقلاع</span><b>${ride.origin}</b></div><div class="place"><span>الوجهة</span><b>${ride.destination}</b></div></div><div class="fare"><span>${ride.distanceKm.toFixed(1)} كم · ${Math.round(ride.durationMin)} د</span><strong>${ride.finalPrice||ride.quotedPrice}</strong></div><div class="actions">${offered?`<button class="main" data-action="accept" data-id="${ride.id}">قبول الرحلة</button><button class="secondary" data-action="navigate" data-id="${ride.id}">اتجاه الإقلاع</button>`:''}${assigned?`<button class="secondary" data-action="navigate" data-id="${ride.id}">فتح موقع الراكب</button><button class="main" data-action="arrived" data-id="${ride.id}" ${ride.status!=='assigned'?'disabled':''}>وصلت إلى الراكب</button><button class="main" data-action="start" data-id="${ride.id}" ${ride.status!=='arrived'?'disabled':''}>بدء الرحلة</button><button class="danger" data-action="finish" data-id="${ride.id}" ${ride.status!=='in_trip'?'disabled':''}>إنهاء عند النقطة الحالية</button>`:''}</div>${ride.status==='in_trip'?'<div class="meter"><div><span>المسافة المسجلة</span><b>تتحدث مع GPS</b></div><div><span>المدة</span><b>عداد نشط</b></div><div><span>الحساب</span><b>حتى الإنهاء</b></div></div>':''}</article>`}).join('');box.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action,Number(b.dataset.id))))} async function load(){try{const data=await api('/api/captain/direct-rides');state.rides=data.rides||[];$('#live-pill').textContent=data.liveDispatchEnabled?'تشغيل حي':'بانتظار اعتماد';render();const active=activeRide();if(active)startWatch(active.id);else stopWatch()}catch(e){if(e.status===401){closeStream();$('#app').classList.add('hidden');$('#login-card').classList.remove('hidden')}else notice(e.message,'warn')}} function startWatch(rideId){if(state.watch)return;if(!navigator.geolocation)return;state.watch=navigator.geolocation.watchPosition(async p=>{await api('/api/captain/direct-rides/location',{method:'POST',body:JSON.stringify({rideId,lat:p.coords.latitude,lng:p.coords.longitude,accuracyM:p.coords.accuracy})}).catch(()=>{})},()=>{}, {enableHighAccuracy:true,maximumAge:10000,timeout:12000})}function stopWatch(){if(state.watch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(state.watch);state.watch=null} async function action(type,id){const ride=state.rides.find(r=>r.id===id);if(!ride)return;try{if(type==='navigate'){const c=ride.originCoordinates;window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${c.lat},${c.lng}`)}`,'_blank','noopener');return}const path={accept:'accept',arrived:'arrived',start:'start',finish:'finish'}[type];const body={};if(type==='start'||type==='finish'){if(!navigator.geolocation)return notice('اسمح بالموقع قبل تشغيل العداد.','warn');const p=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:10000}));body.lat=p.coords.latitude;body.lng=p.coords.longitude;body.accuracyM=p.coords.accuracy}const data=await api(`/api/captain/direct-rides/${id}/${path}`,{method:'POST',body:JSON.stringify(body)});notice(type==='finish'?'انتهت الرحلة؛ السعر النهائي بانتظار مراجعة الإدارة.':type==='arrived'?'سُجل وصولك وأُرسل إشعار للراكب.':'تم تحديث الرحلة.','ok');await load()}catch(e){notice(e.message,'warn')}}$('#login-button').addEventListener('click',async()=>{const b=$('#login-button');b.disabled=true;try{const data=await api('/api/captain/login',{method:'POST',body:JSON.stringify({phone:$('#phone').value.trim(),pin:$('#pin').value.trim()})});V27Notifications.prime();void V27Notifications.requestPermission();connectStream();$('#hello').textContent=`مرحبًا ${data.user.name}`;$('#login-card').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch(e){loginNotice(e.message,'warn')}finally{b.disabled=false}});$('#location-button').addEventListener('click',()=>sendLocation(activeRide()?.id||null));$('#refresh-button').addEventListener('click',load);$('#logout-button').addEventListener('click',async()=>{stopWatch();clearInterval(state.timer);closeStream();await api('/api/captain/logout',{method:'POST'}).catch(()=>{});$('#app').classList.add('hidden');$('#login-card').classList.remove('hidden')});state.timer=setInterval(load,8000);load(); })();
</script>
</body>
</html>
