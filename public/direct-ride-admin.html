<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071522"><link rel="stylesheet" href="/direct-ride-notifications.css"><title>V27</title><style>:root{--bg:#071522;--panel:#0d2437;--line:#234763;--text:#f5f8fb;--muted:#9eb2c2;--mint:#48dfb1;--gold:#f4c96e;--red:#ff8696;font-family:Tahoma,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 85% -10%,#1a465b,transparent 36rem),var(--bg)}button{font:inherit;cursor:pointer}.wrap{width:min(900px,100%);margin:auto;padding:0 14px 42px}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #ffffff17}.brand{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:900;letter-spacing:.08em}.brand img{width:38px;height:38px;object-fit:contain}.top a{color:var(--muted);font-size:10px;text-decoration:none}.hero{padding:27px 2px 14px}.eyebrow{margin:0 0 8px;color:var(--mint);font-size:11px;font-weight:900;letter-spacing:.08em}.hero h1{margin:0;font-size:clamp(30px,7vw,45px);line-height:1.1}.hero p{max-width:58ch;color:var(--muted);font-size:13px;line-height:1.8}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:15px;background:#0d2437}.toolbar span{color:var(--muted);font-size:11px}.button{min-height:43px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:#0b2a40;color:var(--text);font-size:11px;font-weight:800}.button.mint{border-color:#48dfb166;color:var(--mint)}.button.gold{border-color:#f4c96e77;color:var(--gold);background:#f4c96e10}.button.red{border-color:#ff869666;color:#ffc1ca;background:#ff869612}.grid{display:grid;gap:12px;margin-top:12px}.ride{padding:16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#102c42ef,#071827f4)}.ride-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.ride h2{margin:0;font-size:17px}.pill{padding:7px 10px;border:1px solid #48dfb155;border-radius:99px;color:var(--mint);background:#48dfb111;font-size:10px;font-weight:900;white-space:nowrap}.pill.wait{border-color:#f4c96e66;color:var(--gold);background:#f4c96e12}.pill.red{border-color:#ff869666;color:#ffc1ca;background:#ff869612}.route{display:grid;gap:9px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #ffffff17;font-size:11px}.row:last-child{border:0}.row span{color:var(--muted)}.row b{text-align:left}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.stat{padding:11px 9px;border:1px solid #ffffff17;border-radius:11px;background:#061522}.stat span{display:block;color:var(--muted);font-size:9px}.stat b{display:block;margin-top:5px;font-size:15px}.stat:nth-child(1) b{color:var(--gold)}.stat:nth-child(2) b{color:var(--mint)}.events{margin-top:12px;padding-top:10px;border-top:1px solid #ffffff17;color:var(--muted);font-size:10px;line-height:1.8}.events b{color:var(--text)}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.notice{min-height:20px;margin-top:9px;color:var(--muted);font-size:11px;line-height:1.7}.notice.ok{color:var(--mint)}.notice.warn{color:var(--gold)}.empty{margin-top:12px;padding:36px 15px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center;font-size:12px;line-height:1.8}.footer{display:flex;justify-content:space-between;margin-top:15px;color:#6f899b;font-size:9px}@media(max-width:480px){.wrap{padding:0 10px 32px}.stats{grid-template-columns:1fr 1fr}.actions .button{flex:1}.toolbar{align-items:flex-start;flex-direction:column}.toolbar .button{width:100%}}
</style></head>
<body><main class="wrap"><header class="top"><div class="brand"><img src="/aljarah-logo-mark-clean.webp" alt=""><span>V27</span></div><a href="/v27">العودة إلى المركز</a></header><section class="hero"><p class="eyebrow">مركز الرحلات</p><h1>حالة واحدة.<br>قرار واضح.</h1><p>مراقبة الرحلات المباشرة والعروض والأحداث. لا توجد حركة مالية تلقائية من هذه النافذة.</p></section><div class="toolbar"><span id="mode">جارٍ قراءة وضع التشغيل…</span><button class="button mint" id="refresh" type="button">تحديث الرحلات</button></div><div class="notice" id="notice"></div><section class="grid" id="list"></section><footer class="footer"><span>V27 · تشغيل الرحلات</span><span>التسوية بقرار مالك</span></footer></main><script src="/direct-ride-notifications.js"></script><script>(()=>{const $=s=>document.querySelector(s);let eventStream=null;const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const money=c=>`${(Number(c||0)/100).toFixed(2)} د.أ`;const labels={priced:'مسعرة',rider_confirmed:'أكد الراكب',dispatch_pending:'بانتظار التوزيع',offered:'عرض عند كابتن',assigned:'كابتن معيّن',arrived:'وصل الكابتن',in_trip:'قيد الرحلة',completed:'تحتاج مراجعة',cancelled:'ملغاة'};async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'تعذر الاتصال');e.status=r.status;throw e}return d}function render(data){$('#mode').textContent=data.liveDispatchEnabled?'التوزيع الحي مفعّل':'التوزيع الحي متوقف · وضع آمن';const rows=data.rides||[];$('#list').innerHTML=rows.length?rows.map(r=>`<article class="ride"><div class="ride-head"><div><p class="eyebrow">${esc(r.requestCode)}</p><h2>${esc(r.customerName)}</h2></div><span class="pill ${r.status==='cancelled'?'red':r.status==='completed'?'wait':''}">${esc(labels[r.status]||r.status)}</span></div><div class="route"><div class="row"><span>المسار</span><b>${esc(r.origin)} ← ${esc(r.destination)}</b></div><div class="row"><span>الكابتن</span><b>${esc(r.captain?.name||'لم يعيّن بعد')}</b></div></div><div class="stats"><div class="stat"><span>السعر المتوقع</span><b>${esc(r.finalPrice||r.quotedPrice||'—')}</b></div><div class="stat"><span>المسافة</span><b>${Number(r.finalDistanceKm??r.distanceKm).toFixed(1)} كم</b></div><div class="stat"><span>الحساب</span><b>${r.finalPrice?esc(r.finalPrice):'مؤجل'}</b></div></div><div class="events">${(r.events||[]).slice(-5).reverse().map(e=>`<div><b>${esc(labels[e.eventType]||e.eventType)}</b> · ${esc(e.createdAt||'')}</div>`).join('')||'لا توجد أحداث بعد'}</div><div class="actions">${['rider_confirmed','dispatch_pending'].includes(r.status)?`<button class="button gold" data-action="dispatch" data-id="${r.id}">توزيع على الأقرب</button>`:''}${!['completed','cancelled'].includes(r.status)?`<button class="button red" data-action="cancel" data-id="${r.id}">إلغاء الرحلة</button>`:''}</div></article>`).join(''):'<div class="empty">لا توجد رحلات مباشرة مسجلة حتى الآن.</div>';document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action,Number(b.dataset.id))))}function connectStream(){if(eventStream||!window.V27Notifications)return;eventStream=V27Notifications.connect({url:'/api/admin/direct-rides/events',audience:'admin',onEvent:(payload)=>{if(!payload.silent)void load()},onConnectionChange:(status)=>{if(status==='connected'){$('#notice').textContent='البث الفوري لمركز V27 مفعّل.';$('#notice').className='notice ok'}if(status==='reconnecting'){$('#notice').textContent='جاري إعادة الاتصال؛ التحديث الدوري يعمل.';$('#notice').className='notice warn'}}})}async function load(){try{const d=await api('/api/admin/direct-rides');render(d);connectStream();$('#notice').textContent='تمت مزامنة الرحلات.';$('#notice').className='notice ok'}catch(e){$('#notice').textContent=e.status===401?'سجّل الدخول من مركز V27 أولًا ثم افتح هذه النافذة.':e.message;$('#notice').className='notice warn'}}async function action(type,id){const reason=type==='cancel'?window.prompt('سبب إلغاء الرحلة:','قرار المالك'):null;if(type==='cancel'&&reason===null)return;try{const d=await api(`/api/admin/direct-rides/${id}/${type}`,{method:'POST',body:JSON.stringify(type==='cancel'?{reason}:{})});$('#notice').textContent=d.dispatch?.paused?'التوزيع الحي متوقف؛ بقيت الرحلة في وضع آمن.':'تم تحديث قرار الرحلة.';$('#notice').className='notice ok';await load()}catch(e){$('#notice').textContent=e.message;$('#notice').className='notice warn'}}$('#refresh').addEventListener('click',load);load();setInterval(load,8000)})()</script></body></html>
