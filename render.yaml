services:
  - type: web
    name: whatsapserver-1
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && PUPPETEER_CACHE_DIR=/opt/render/.cache/puppeteer npx puppeteer browsers install chrome@146.0.7680.31
    startCommand: node server.js
    healthCheckPath: /status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "false"
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "false"
