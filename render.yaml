services:
  - type: web
    name: whatsapserver-1
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && PUPPETEER_CACHE_DIR=$PWD/.cache/puppeteer npx puppeteer browsers install chrome
    startCommand: node server.js
    healthCheckPath: /status
    disk:
      name: whatsapserver-data
      mountPath: /app/data
      sizeGB: 10
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "false"
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "false"
      - key: DATA_DIR
        value: /app/data
      - key: AUTH_PATH
        value: /app/data/.wwebjs_auth
      - key: BAILEYS_AUTH_PATH
        value: /app/data/.baileys_auth
      - key: BAILEYS_ENABLED
        value: "false"
      - key: WHATSAPP_CLIENT_ID
        value: aljarah-main-v2
